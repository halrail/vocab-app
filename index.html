<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wordbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c2740;--soft:#5b6578;--paper:#f4f6f8;--line:#d3d9e2;--sheet:#e24848;--ok:#1f7a4d}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 "Zen Kaku Gothic New",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:2.5rem 1.25rem 4rem}
h1{font:600 2.5rem/1.15 "Newsreader",Georgia,serif;margin:0}
.lead{margin:.25rem 0 2rem;color:var(--soft)}
[hidden]{display:none!important}
label{display:block;font-size:.85rem;color:var(--soft);margin-top:1rem}
input[type=text],input[type=email],input[type=password]{width:100%;font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1.5px solid var(--line);padding:.5rem 0;border-radius:0}
input:focus-visible{outline:none;border-bottom-color:var(--ink)}
button{font:inherit;cursor:pointer}
button:focus-visible,input[type=checkbox]:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.primary{background:var(--ink);color:#fff;border:0;border-radius:6px;padding:.7rem 1.4rem;min-height:44px;font-weight:700}
.primary:disabled{opacity:.5;cursor:wait}
.link{background:none;border:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;padding:.6rem .25rem;min-height:44px}
.actions{display:flex;gap:1rem;align-items:center;margin-top:1.5rem}
#msg{min-height:1.7em;margin:1rem 0 0;color:var(--sheet);font-weight:500}
#msg.ok{color:var(--ok)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1.5rem}
.bar small{color:var(--soft);overflow-wrap:anywhere}
.tabs{display:flex;gap:.5rem;margin-bottom:1rem}
.tab{background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:.35rem 1rem;min-height:44px}
.tab[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tools{display:flex;justify-content:space-between;align-items:center;gap:1rem;border-bottom:1.5px solid var(--ink);padding-bottom:.5rem}
.tools label{display:flex;align-items:center;gap:.5rem;margin:0;color:var(--ink);font-size:.95rem}
#count{color:var(--soft);font-size:.9rem;text-align:right}
ul{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) auto;gap:.25rem 1rem;align-items:center;padding:.7rem 0;border-bottom:1px solid var(--line)}
.en{font:600 1.35rem/1.3 "Newsreader",Georgia,serif;overflow-wrap:anywhere}
.lv{display:block;font:.7rem/1 system-ui;letter-spacing:.15em;color:var(--soft);margin-top:.2rem}
.ja{font:inherit;color:var(--ink);text-align:left;background:none;border:0;padding:.15rem .5rem;margin-left:-.5rem}
button.ja.covered{background:var(--sheet);color:transparent;border-radius:3px;user-select:none;transition:background .15s,color .15s}
.rates{display:flex;gap:.4rem}
.rate{min-height:44px;padding:.3rem .9rem;border-radius:6px;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
.rate.yes{background:var(--ink);color:#fff}
.empty{display:block;padding:2rem 0;color:var(--soft)}
@media (max-width:480px){
  li{grid-template-columns:1fr auto}.ja{grid-column:1/3;grid-row:2}.rates{grid-column:2;grid-row:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>Wordbook</h1>
  <p class="lead">みんなで使う単語帳。進度は自分だけのもの。</p>
  <p id="msg" role="alert"></p>

  <form id="authForm" autocomplete="on">
    <label for="email">メールアドレス</label>
    <input id="email" type="email" autocomplete="email" required>
    <label for="password">パスワード(6文字以上)</label>
    <input id="password" type="password" autocomplete="current-password" minlength="6" required>
    <div class="actions">
      <button class="primary" id="login" type="submit">ログイン</button>
      <button class="link" id="signup" type="button">新規登録</button>
    </div>
  </form>

  <section id="app" hidden>
    <div class="bar">
      <small id="who"></small>
      <button class="link" id="logout" type="button">ログアウト</button>
    </div>
    <div class="tabs">
      <button class="tab" id="tabDue" type="button" aria-pressed="true">今日の復習</button>
      <button class="tab" id="tabAll" type="button" aria-pressed="false">すべて</button>
    </div>
    <div class="tools">
      <label><input type="checkbox" id="hide"> 意味を隠す(タップで表示)</label>
      <span id="count"></span>
    </div>
    <ul id="list"></ul>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://xftnorrxnxkhgyedreff.supabase.co";
const SUPABASE_KEY = "sb_publishable_cxaIfEoQtmORuPkMQvtzQQ_Z1lLyj3I";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = (id) => document.getElementById(id);

const GAP = [0, 1, 3, 7]; // 覚えた度合いごとの、次の復習までの日数
let items = [], view = "due", uid = null, hideMode = false;
const revealed = new Set();
try { hideMode = localStorage.getItem("hideMeaning") === "1"; } catch (e) {}
$("hide").checked = hideMode;

const dateStr = (d) => d.toLocaleDateString("sv-SE"); // 例: 2026-11-01
const prog = (v) => v.progress && v.progress[0];
const isDue = (v) => !prog(v) || prog(v).next_review <= dateStr(new Date());

function say(text, ok) { $("msg").textContent = text || ""; $("msg").className = ok ? "ok" : ""; }
function ja(msg) {
  if (/Invalid login credentials/i.test(msg)) return "メールアドレスかパスワードが違います。";
  if (/already registered/i.test(msg)) return "このメールアドレスは登録済みです。ログインしてください。";
  if (/at least 6/i.test(msg)) return "パスワードは6文字以上にしてください。";
  if (/valid email|invalid format/i.test(msg)) return "メールアドレスの形式を確認してください。";
  return msg;
}
async function busy(btns, fn) {
  btns.forEach((b) => (b.disabled = true));
  try { await fn(); } finally { btns.forEach((b) => (b.disabled = false)); }
}

async function rate(v, ok) {
  const p = prog(v);
  const level = ok ? Math.min(3, (p ? p.level : 0) + 1) : 0;
  const d = new Date();
  d.setDate(d.getDate() + GAP[level]);
  const next = dateStr(d);
  const { error } = await db.from("progress").upsert(
    { user_id: uid, vocab_id: v.id, level, next_review: next, updated_at: new Date().toISOString() },
    { onConflict: "user_id,vocab_id" }
  );
  if (error) return say(ja(error.message));
  v.progress = [{ level, next_review: next }];
  revealed.delete(v.id);
  render();
}

function render() {
  const due = items.filter(isDue);
  const shown = view === "due" ? due : items;
  $("count").textContent = "今日の復習 " + due.length + "語 / 全" + items.length + "語";
  $("tabDue").setAttribute("aria-pressed", view === "due");
  $("tabAll").setAttribute("aria-pressed", view === "all");
  const list = $("list");
  list.innerHTML = "";
  if (!shown.length) {
    const li = document.createElement("li");
    const s = document.createElement("span");
    s.className = "empty";
    s.textContent = items.length ? "今日の復習はすべて終わりました。「すべて」で全単語を見られます。" : "単語帳にまだ単語がありません。";
    li.append(s);
    list.append(li);
    return;
  }
  shown.forEach((v) => {
    const lvl = prog(v) ? prog(v).level : 0;
    const li = document.createElement("li");

    const left = document.createElement("div");
    const en = document.createElement("span");
    en.className = "en";
    en.textContent = v.word;
    const lv = document.createElement("span");
    lv.className = "lv";
    lv.textContent = "●".repeat(lvl) + "○".repeat(3 - lvl);
    lv.setAttribute("aria-label", "覚えた度合い " + lvl + "/3");
    left.append(en, lv);

    const covered = hideMode && !revealed.has(v.id);
    const meaning = document.createElement(covered ? "button" : "span");
    meaning.className = "ja" + (covered ? " covered" : "");
    meaning.textContent = v.meaning;
    if (covered) {
      meaning.type = "button";
      meaning.setAttribute("aria-label", v.word + " の意味を表示");
      meaning.onclick = () => { revealed.add(v.id); render(); };
    }

    const rates = document.createElement("div");
    rates.className = "rates";
    [["まだ", false], ["覚えた", true]].forEach(([label, ok]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "rate" + (ok ? " yes" : "");
      b.textContent = label;
      b.setAttribute("aria-label", v.word + " を" + label + "にする");
      b.onclick = () => busy([b], () => rate(v, ok));
      rates.append(b);
    });

    li.append(left, meaning, rates);
    list.append(li);
  });
}

async function loadVocab() {
  const { data, error } = await db.from("vocab").select("id,word,meaning,position,progress(level,next_review)").order("position");
  if (error) return say(ja(error.message));
  items = data;
  render();
}

function showState(session) {
  $("authForm").hidden = !!session;
  $("app").hidden = !session;
  if (session) {
    $("who").textContent = session.user.email;
    if (session.user.id !== uid) { uid = session.user.id; say(""); loadVocab(); }
  } else { uid = null; items = []; revealed.clear(); }
}

$("authForm").onsubmit = (e) => {
  e.preventDefault();
  busy([$("login"), $("signup")], async () => {
    say("");
    const { error } = await db.auth.signInWithPassword({ email: $("email").value, password: $("password").value });
    if (error) say(ja(error.message));
  });
};
$("signup").onclick = () => {
  if (!$("authForm").reportValidity()) return;
  busy([$("login"), $("signup")], async () => {
    say("");
    const { data, error } = await db.auth.signUp({ email: $("email").value, password: $("password").value });
    if (error) return say(ja(error.message));
    if (!data.session) say("確認メールを送りました。メール内のリンクを開いてからログインしてください。", true);
  });
};
$("logout").onclick = () => db.auth.signOut();
$("tabDue").onclick = () => { view = "due"; render(); };
$("tabAll").onclick = () => { view = "all"; render(); };
$("hide").onchange = (e) => {
  hideMode = e.target.checked;
  revealed.clear();
  try { localStorage.setItem("hideMeaning", hideMode ? "1" : "0"); } catch (err) {}
  render();
};

db.auth.onAuthStateChange((_event, session) => showState(session));
db.auth.getSession().then(({ data }) => showState(data.session));
</script>
</body>
</html>
